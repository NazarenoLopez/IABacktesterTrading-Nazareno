name: Deploy to Oracle Cloud

on:
  push:
    branches:
      - main
      - fix/1
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Oracle Cloud VM
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Execute Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USERNAME }}
          key: ${{ secrets.OCI_KEY }}
          port: ${{ secrets.OCI_PORT || 22 }}
          script_stop: true
          script: |
            set -ex
            echo "🚀 [CI/CD] Iniciando despliegue en Oracle Cloud..."

            APP_DIR="$HOME/IABacktesterTrading-Nazareno"

            # Si el directorio no existe en el home, intentar clonarlo o buscarlo
            if [ ! -d "$APP_DIR" ]; then
              echo "Clonando repositorio en $APP_DIR..."
              git clone https://github.com/NazarenoLopez/IABacktesterTrading-Nazareno.git "$APP_DIR"
            fi

            cd "$APP_DIR"
            echo "Directorio actual: $(pwd)"

            # Sincronizar con el último commit de main
            git remote set-url origin https://github.com/NazarenoLopez/IABacktesterTrading-Nazareno.git
            git fetch origin main
            git reset --hard origin/main

            # Ejecutar el script de configuración con bash
            chmod +x scripts/setup_oracle.sh
            TG_TOKEN="${{ secrets.TELEGRAM_BOT_TOKEN }}" TG_CHAT="${{ secrets.TELEGRAM_CHAT_ID }}" bash scripts/setup_oracle.sh
