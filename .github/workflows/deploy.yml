name: Deploy to Oracle Cloud

on:
  push:
    branches:
      - main
      - fix/1
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Oracle Cloud VM
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Execute Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USERNAME }}
          key: ${{ secrets.OCI_KEY }}
          port: ${{ secrets.OCI_PORT || 22 }}
          script_stop: true
          script: |
            set -e
            echo "🚀 [CI/CD] Iniciando despliegue automático en Oracle Cloud..."

            CURRENT_USER=$(whoami)
            APP_DIR="/home/$CURRENT_USER/IABacktesterTrading-Nazareno"

            # 1. Asegurar git en la máquina
            if ! command -v git &> /dev/null; then
              if command -v apt-get &> /dev/null; then
                sudo apt-get update -y -qq && sudo apt-get install -y -qq git
              elif command -v dnf &> /dev/null; then
                sudo dnf install -y -q git
              fi
            fi

            # 2. Clonar repo si no existe, o actualizar si ya existe
            if [ ! -d "$APP_DIR/.git" ]; then
              echo "📦 Clonando repositorio por primera vez..."
              git clone "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" "$APP_DIR"
              cd "$APP_DIR"
            else
              echo "📦 Sincronizando repositorio existente..."
              cd "$APP_DIR"
              git fetch "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ${{ github.ref_name }}
              git reset --hard FETCH_HEAD
            fi

            # 3. Ejecutar script de configuración y reinicio del servicio
            chmod +x scripts/setup_oracle.sh
            TG_TOKEN="${{ secrets.TELEGRAM_BOT_TOKEN }}" TG_CHAT="${{ secrets.TELEGRAM_CHAT_ID }}" ./scripts/setup_oracle.sh
