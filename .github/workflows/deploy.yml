name: Deploy 100% Automatic to Oracle Cloud

on:
  push:
    branches:
      - main
      - fix/1
  workflow_dispatch:

jobs:
  deploy:
    name: Auto Deploy to Oracle VM
    runs-on: ubuntu-latest

    steps:
      - name: Deploy and Configure Oracle VM via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USERNAME }}
          key: ${{ secrets.OCI_KEY }}
          port: ${{ secrets.OCI_PORT || 22 }}
          script_stop: true
          script: |
            set -e
            echo "🚀 [CI/CD] Iniciando despliegue 100% automático en Oracle Cloud..."

            CURRENT_USER=$(whoami)
            APP_DIR="/home/$CURRENT_USER/IABacktesterTrading-Nazareno"

            # 1. Instalar dependencias del sistema operativo si faltan
            echo "📦 [1/6] Verificando dependencias del sistema (Python, venv, git)..."
            if command -v apt-get &> /dev/null; then
              sudo apt-get update -y -qq
              sudo apt-get install -y -qq python3 python3-pip python3-venv git curl build-essential iptables-persistent
            elif command -v dnf &> /dev/null; then
              sudo dnf install -y -q python3 python3-pip git curl gcc gcc-c++
            fi

            # 2. Abrir puerto 8000 en el firewall local de Oracle (iptables)
            echo "🛡️ [2/6] Configurando firewall de la máquina..."
            if command -v ufw &> /dev/null; then
              sudo ufw allow 8000/tcp || true
            fi
            sudo iptables -I INPUT 6 -m state --state NEW -p tcp --dport 8000 -j ACCEPT || true
            if command -v netfilter-persistent &> /dev/null; then
              sudo netfilter-persistent save || true
            fi

            # 3. Clonar el repositorio automáticamente si no existe, o actualizar si ya existe
            echo "📥 [3/6] Obteniendo el código del repositorio..."
            if [ ! -d "$APP_DIR/.git" ]; then
              echo "Anotación: Primer despliegue detectado. Clonando repositorio..."
              git clone "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" "$APP_DIR"
              cd "$APP_DIR"
            else
              echo "Anotación: Repositorio existente. Sincronizando cambios..."
              cd "$APP_DIR"
              git fetch "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ${{ github.ref_name }}
              git reset --hard FETCH_HEAD
            fi

            # 4. Configurar variables de entorno (.env) automáticamente
            echo "🔐 [4/6] Configurando variables de entorno (.env)..."
            if [ -n "${{ secrets.TELEGRAM_BOT_TOKEN }}" ]; then
              cat <<EOF > .env
TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
TELEGRAM_CHAT_ID=${{ secrets.TELEGRAM_CHAT_ID }}
EOF
            elif [ ! -f ".env" ]; then
              touch .env
            fi

            # 5. Configurar entorno virtual de Python e instalar librerías
            echo "🐍 [5/6] Preparando entorno virtual Python e instalando dependencias..."
            if [ ! -d ".venv" ]; then
              python3 -m venv .venv
            fi
            source .venv/bin/activate
            pip install --upgrade pip -q
            pip install -r requirements.txt -q

            # 6. Crear/Actualizar servicio systemd para que corra siempre en segundo plano
            echo "⚙️ [6/6] Configurando servicio systemd (backtester.service)..."
            SERVICE_FILE="/etc/systemd/system/backtester.service"
            sudo bash -c "cat <<EOF > $SERVICE_FILE
[Unit]
Description=IA Backtester Trading Web Server & Bot
After=network.target

[Service]
Type=simple
User=$CURRENT_USER
WorkingDirectory=$APP_DIR
ExecStart=$APP_DIR/.venv/bin/python web/server.py
Restart=always
RestartSec=5
EnvironmentFile=-$APP_DIR/.env
StandardOutput=journal
StandardError=journal

[Install]
WantedBy=multi-user.target
EOF"

            sudo systemctl daemon-reload
            sudo systemctl enable backtester
            sudo systemctl restart backtester

            # Verificar que arrancó exitosamente
            sleep 3
            if sudo systemctl is-active --quiet backtester; then
              echo "=================================================================="
              echo "✅ ¡DESPLIEGUE EXITOSO!"
              echo "El servidor está activo y escuchando en el puerto 8000."
              echo "=================================================================="
            else
              echo "❌ El servicio falló al arrancar. Últimos logs:"
              sudo journalctl -u backtester -n 40 --no-pager
              exit 1
            fi
